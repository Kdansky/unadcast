server {
    listen 80;
    # Behind a published port: redirects must not name the container's own port.
    absolute_redirect off;
    root /srv;
    default_type application/octet-stream;
    types {
        application/rss+xml xml;
        audio/mpeg mp3;
    }
    # Feeds change; audio files never do once published.
    location ~ \.xml$ { add_header Cache-Control "no-cache"; }
    location ~ \.mp3$ { add_header Cache-Control "public, max-age=604800"; }
    # Copies in progress.
    location ~ \.part$ { return 404; }
    # Synology's recycle bin lives in every share.
    location ^~ /#recycle { return 404; }
    location = / { return 302 /admin/; }
    location /admin/ {
        proxy_pass http://admin:8000;
        proxy_set_header Host $host;
    }
}

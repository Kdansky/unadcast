# The `web` container, on the published port: the admin page, and everything else from `files`. It mounts nothing, so it
# starts and the admin page works while the share is down.
server {
    listen 80;
    # Behind a published port: redirects must not name the container's own port.
    absolute_redirect off;
    # Names looked up per request, through Docker's DNS: nginx starts while `files` can't, and finds rebuilt containers.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $admin http://admin:8000;
    set $files http://files:80;
    location = / { return 302 /admin/; }
    location /admin/ {
        proxy_pass $admin;
        # With the port: the pending feed links back to this page.
        proxy_set_header Host $http_host;
    }
    location / {
        proxy_pass $files;
        # Audio streams through rather than into temporary files on the SD card.
        proxy_buffering off;
    }
}

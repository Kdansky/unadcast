# The `files` container: published feeds and audio, read-only. The only one that mounts the share, so that when it is
# down, only this is.
server {
    listen 80;
    absolute_redirect off;
    root /srv;
    default_type application/octet-stream;
    types {
        application/rss+xml xml;
        audio/mpeg mp3;
        application/json json;
    }
    # Feeds change; audio files never do once published.
    location ~ \.xml$ { add_header Cache-Control "no-cache"; }
    location ~ \.mp3$ { add_header Cache-Control "public, max-age=604800"; }
    # Copies in progress.
    location ~ \.part$ { return 404; }
    # Synology's recycle bin lives in every share.
    location ^~ /#recycle { return 404; }
}

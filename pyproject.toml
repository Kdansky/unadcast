[project]
name = "unadcast"
version = "0.1.0"
description = "Remove ads from podcast episodes and republish the feed"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.0",
    "faster-whisper>=1.1",
    "numpy>=2.0",
    "nvidia-cublas-cu12; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux'",
    "onnxruntime>=1.18",
    "scipy>=1.13",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
unadcast = "unadcast.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
